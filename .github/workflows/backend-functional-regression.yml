name: Backend Functional Regression

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Branch, tag, or commit from the public backend repository
        required: true
        default: codex/auction-registration-payment
        type: string

permissions:
  contents: read

concurrency:
  group: backend-functional-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional-regression:
    name: Functional regression and Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALLURE_VERSION: 2.30.0
      COMPOSE_FILE: .github/ci/docker-compose.yml
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out QA repository
        uses: actions/checkout@v5

      - name: Check out public backend repository
        uses: actions/checkout@v5
        with:
          repository: weiba0106/dy_live_auction_weiba
          ref: ${{ inputs.backend_ref || 'codex/auction-registration-payment' }}
          path: backend
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Allure command line
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar --extract --gzip --file /tmp/allure.tgz --directory /opt
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
          /opt/allure-${ALLURE_VERSION}/bin/allure --version

      - name: Compile and collect functional tests
        run: |
          python -m compileall -q clients commons config load models scenarios support tests ws
          python -m pytest --collect-only -q \
            tests/health \
            tests/auth \
            tests/room \
            tests/auction \
            tests/bid \
            tests/concurrency \
            tests/ws

      - name: Validate CI Compose configuration
        shell: bash
        run: |
          test -f backend/server/Dockerfile
          test -f backend/docs/init.sql
          docker compose --file "$COMPOSE_FILE" config --quiet

      - name: Replace unavailable backend runtime image for CI
        shell: bash
        run: |
          dockerfile=backend/server/Dockerfile
          if grep --quiet '^FROM openjdk:17-slim$' "$dockerfile"; then
            sed --in-place \
              's|^FROM openjdk:17-slim$|FROM eclipse-temurin:17-jre-jammy|' \
              "$dockerfile"
          fi
          if grep --quiet '^FROM openjdk:17-slim$' "$dockerfile"; then
            echo "The unavailable openjdk:17-slim image is still configured."
            exit 1
          fi
          grep '^FROM ' "$dockerfile"

      - name: Build and start backend services
        run: docker compose --file "$COMPOSE_FILE" up --detach --build mysql redis backend

      - name: Wait for backend health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/api/health > /dev/null; then
              echo "Backend is healthy after attempt ${attempt}."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy within 300 seconds."
          docker compose --file "$COMPOSE_FILE" ps
          exit 1

      - name: Run functional regression
        id: functional_tests
        continue-on-error: true
        run: |
          python -m pytest \
            tests/health \
            tests/auth \
            tests/room \
            tests/auction \
            tests/bid \
            tests/concurrency \
            tests/ws

      - name: Generate Allure HTML report
        id: allure_report
        if: always()
        continue-on-error: true
        run: python -c "from run import run_allure_report; raise SystemExit(run_allure_report())"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Backend functional regression" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend ref: \`${{ inputs.backend_ref || 'codex/auction-registration-payment' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend commit: \`$(git -C backend rev-parse HEAD 2>/dev/null || echo unavailable)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test step: \`${{ steps.functional_tests.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure generation: \`${{ steps.allure_report.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/result.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat reports/result.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload private Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-functional-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports/allures/
            reports/temps/
            reports/result.txt
            reports/traceability.md
            reports/traceability-current.md
          if-no-files-found: warn
          retention-days: 14

      - name: Show backend diagnostics
        if: ${{ always() && (failure() || steps.functional_tests.outcome == 'failure' || steps.allure_report.outcome == 'failure') }}
        continue-on-error: true
        run: |
          docker compose --file "$COMPOSE_FILE" ps
          docker compose --file "$COMPOSE_FILE" logs --no-color backend

      - name: Stop backend services
        if: always()
        continue-on-error: true
        run: docker compose --file "$COMPOSE_FILE" down --volumes --remove-orphans

      - name: Propagate test and report failures
        if: always()
        shell: bash
        run: |
          exit_code=0
          if [ "${{ steps.functional_tests.outcome }}" = "failure" ]; then
            echo "Functional regression failed."
            exit_code=1
          fi
          if [ "${{ steps.allure_report.outcome }}" = "failure" ]; then
            echo "Allure report generation failed."
            exit_code=1
          fi
          exit "$exit_code"
