[pytest]
# 参考 api_test_frame: -vs 输出详情, --alluredir 原始结果写 reports/temps, --clean-alluredir 每次清空, --durations=0 统计接口耗时
addopts = -vs --alluredir=reports/temps --clean-alluredir --durations=0

# 执行的测试用例目录
testpaths = tests

# 项目根加入 sys.path, 支持 from clients/... 等绝对导入
pythonpath = .

# 屏蔽警告
filterwarnings =
    error
    ignore::UserWarning

# pytest 检索用例格式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 用例标记
markers =
    case_id(id): stable business case id used by chain orchestration
    smoke: core smoke API suite
    regression: full live auction API regression suite
    load: k6 load and concurrency suite
    api: HTTP API 用例
    health: 健康检查域
    auth: 认证域
    room: 直播间域
    auction: 竞拍域
    bid: 出价域
    ws: WebSocket 域
    concurrency: 并发域
    perf: 性能域
    stress: 压力/稳定性用例 (长时间高并发, k6 执行)
    slow: 慢速用例 (需等待自然到期/延时窗口)

# 控制台中文显示
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
